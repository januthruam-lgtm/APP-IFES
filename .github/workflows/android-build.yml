name: Android Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir projeto Android
        run: test -d android || (echo "Pasta android/ não está no repositório" && exit 1)

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: bun install

      - name: Build web e sincronizar Capacitor
        env:
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
        run: bun run build:native

      - name: Gerar APK de teste (assinado com chave debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: brain-studio-apk
          path: android/app/build/outputs/apk/debug/*.apk