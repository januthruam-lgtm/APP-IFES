
name: Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compilar APP-IFES
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null || true
          ls -la "$ANDROID_HOME"

      - name: Instalar dependencias
        run: npm install

      - name: Compilar e sincronizar Capacitor
        run: npm run build:native

      - name: Localizar sdkmanager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado no ambiente."
            exit 1
          fi

          echo "path=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          echo "SDK encontrado: $SDKMANAGER"

      - name: Aceitar licencas Android
        shell: bash
        run: |
          set +o pipefail
          yes | "${{ steps.sdk.outputs.path }}" --licenses
          test "${PIPESTATUS[1]}" -eq 0

      - name: Preparar Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: APP-IFES-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
