    <meta name="theme-color" content="#EEF2EC" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tema');
          if (t !== 'claro' && t !== 'escuro') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'escuro' : 'claro';
            localStorage.setItem('tema', t);
          }
          if (t === 'escuro') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'escuro');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'claro');
          }
        } catch (e) {}
      })();
    </script>
    <meta name="application-name" content="Brain Studio" />
